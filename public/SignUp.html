<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – 100 Days 100 Web Projects</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Ensures the layout doesn't create black boxes from empty containers */
    .hero-section { background: transparent !important; }
    .error-msg { font-size: 12px; color: #ff8c8c; margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>
  <div class="noise-layer"></div>

  <section class="hero-section">
    <h1 class="hero-title">100 Days 100 Web Projects</h1>
    <p class="auth-title">Create your account to track your progress.</p>

    <div class="auth-container">
      <div class="auth-card">
        <h2 class="auth-title-1">Sign Up</h2>
        
        <form id="signupForm" class="auth-form" novalidate>
          
          <div class="form-group" id="grp-name">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="name" placeholder="Full Name" class="form-input" />
            <span class="error-msg" id="err-name"></span>
          </div>

          <div class="form-group" id="grp-username">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Username" class="form-input" />
            <span class="error-msg" id="err-username"></span>
          </div>

          <div class="form-group" id="grp-email">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Email Address" class="form-input" />
            <span class="error-msg" id="err-email"></span>
          </div>

          <div class="form-group" id="grp-password">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password" class="form-input" />
            <span class="error-msg" id="err-password"></span>
          </div>

          <div class="form-group" id="grp-confirm-password">
            <i class="fa-solid fa-lock-open"></i>
            <input type="password" id="confirm-password" placeholder="Confirm Password" class="form-input" />
            <span class="error-msg" id="err-confirm-password"></span>
          </div>
          
          <button type="submit" class="button signup-btn" id="signupBtn">
            Create Account <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p class="already-signed-up">
          Already signed up? <a href="Login.html">Login here</a>
        </p>
      </div>
    </div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const emailRx = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passwordRx = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{6,}$/;

    function setField(groupId, errorId, message) {
      const group = $(groupId);
      const error = $(errorId);
      error.textContent = message;
    }

    $('signupForm').addEventListener('submit', e => {
      e.preventDefault();
      
      const name = $('name').value.trim();
      const username = $('username').value.trim();
      const email = $('email').value.trim();
      const password = $('password').value;
      const confirmPassword = $('confirm-password').value;

      let ok = true;

      // Reset errors
      ['name', 'username', 'email', 'password', 'confirm-password'].forEach(id => {
          setField(`grp-${id}`, `err-${id}`, '');
      });

      if (name.length < 3) { setField('grp-name', 'err-name', 'Min 3 characters'); ok = false; }
      if (username.length < 4) { setField('grp-username', 'err-username', 'Min 4 characters'); ok = false; }
      if (!emailRx.test(email)) { setField('grp-email', 'err-email', 'Invalid email'); ok = false; }
      if (!passwordRx.test(password)) { setField('grp-password', 'err-password', 'Must have Uppercase, Number, Special Char, 6+ length'); ok = false; }
      if (password !== confirmPassword) { setField('grp-confirm-password', 'err-confirm-password', 'Passwords do not match'); ok = false; }

      if (ok) {
        if (localStorage.getItem(username)) {
          alert("Username already exists!");
          return;
        }
        localStorage.setItem(username, JSON.stringify({ name, email, password }));
        alert("Signup successful!");
        window.location.href = "Login.html";
      }
    });
  </script>
</body>
</html>
