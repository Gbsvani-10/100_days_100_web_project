<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — 100 Days 100 Web Projects</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-left" aria-hidden="true"></div>
  <div class="ambient ambient-right" aria-hidden="true"></div>
  <div class="noise-layer" aria-hidden="true"></div>

  <nav class="navbar">
    <a href="../index.html" class="button home-btn">Home</a>
  </nav>

  <section class="hero-section">
    <h1 class="hero-title">100 Days 100 Web Projects</h1>
    <div class="auth-container">
      <div class="auth-card">
        <h2 class="auth-title-1">Login</h2>
        <div id="statusMsg" style="display:none; padding: 10px; border-radius: 8px; margin-bottom: 16px; text-align: center;"></div>
        
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Username" class="form-input" required />
          </div>
          <div class="form-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password" class="form-input" required />
            <span class="toggle-password" onclick="togglePassword()" style="position:absolute; right:15px; top:12px; cursor:pointer;">👁</span>
          </div>
          <button type="submit" class="button home-btn" id="loginBtn" style="width:100%;">Login</button>
        </form>

        <p class="already-signed-up" style="margin-top: 15px;">
          Not signed up? <a href="./SignUp.html">Sign Up</a>
        </p>
      </div>
    </div>
  </section>

  <script>
    // 1. PROTECTION: If ALREADY logged in, send them to home so they don't see the login screen again
    if (localStorage.getItem("loggedInUser")) {
      window.location.href = "../index.html";
    }

    // 2. Status Helper
    function showStatus(msg, type) {
      const div = document.getElementById("statusMsg");
      div.textContent = msg;
      div.style.display = "block";
      div.style.background = type === "error" ? "rgba(255, 75, 75, 0.15)" : "rgba(59, 130, 246, 0.15)";
      div.style.color = type === "error" ? "#ff8c8c" : "#9cc2ff";
    }

    // 3. Toggle Password
    function togglePassword() {
      const p = document.getElementById("password");
      p.type = p.type === "password" ? "text" : "password";
    }

    // 4. Login Logic
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      const storedRaw = localStorage.getItem(username);
      if (!storedRaw) {
        showStatus("User does not exist.", "error");
        return;
      }

      const userData = JSON.parse(storedRaw);
      if (password !== userData.password) {
        showStatus("Incorrect password.", "error");
        return;
      }

      localStorage.setItem("loggedInUser", username);
      showStatus("Login successful! Redirecting...", "success");
      setTimeout(() => { window.location.href = "../index.html"; }, 1000);
    });
  </script>
</body>
</html>
